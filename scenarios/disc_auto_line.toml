# A 2013 disc robot (configs/disc_robot.toml) on the 2013 test range: from auto_line_left, beside the pyramid and
# facing the HIGH goal 5.21 m away, it shoots its 4 preloaded discs into the HIGH goal in autonomous. The robot
# program is tests/fake_robot_main.py --shoot: the shooter at full output from the start of auto, the loader feeding
# from 1.5 s. The channel is tilted 22.5 degrees, the middle of the 21.5-23.75 degree band where all four score.
#   scrimmage run scenarios/disc_auto_line.toml
config = "../configs/disc_robot.toml"
description = "Disc robot on the 2013 range: 4 preloaded discs from the auto line into the HIGH goal"

[range]
start = "auto_line_left"
preload = 4

[[step]]
mode = "disabled"
duration = 0.5
[[step]]
name = "auto"
mode = "auto"
duration = 8.0
  # Lockstep repeats exactly: the four discs leave about 1.8, 2.0, 2.2 and 2.3 s into auto and all four score by
  # about 2.8 s. The checks leave seconds of margin for slower spin-up or feeding, not for chance.
  [[step.check]]
  by_time = { signal = "score.high", min = 3, t = 6 }
  [[step.check]]
  at_end = { signal = "fired", min = 4 }
  [[step.check]]
  console = { contains = "shoot: feeding" }
