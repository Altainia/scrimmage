name: CI

on:
  push:
    branches: [main]
  pull_request:
  # weekly run catches breakage from new runner images and new RobotPy/MuJoCo releases
  schedule:
    - cron: "0 11 * * 2"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # headless rendering for screenshots (no GPU on CI): Mesa's software OSMesa
      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - name: Install
        run: |
          pip install -e ".[dev,nt,mcp,cad,bench]"
          pip install ./lockstep
      # the e2e and extension tests skip themselves without these; fail here instead so CI never passes on skipped tests
      - name: Check RobotPy, the DS socket, the vendor libraries, commands2 and the lockstep extension are importable
        run: >
          python -c "import wpilib, halsim_ws, halsim_ds_socket, scrimmage_lockstep, mcp, ntcore, rev, commands2,
          phoenix6, libgrapplefrc"
      # the assembler's browser tests drive headless Chromium (WebGL through SwiftShader); the playwright version is
      # pinned in the dev extra, so this downloads the Chromium build that version expects
      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: Test
        env:
          MUJOCO_GL: osmesa
          SCRIMMAGE_SKIP_JAVA: "1"   # the java job below runs the Java tests
          SCRIMMAGE_SKIP_FREECAD: "1"   # the freecad job below runs the FreeCAD tests
          SCRIMMAGE_REQUIRE_BROWSER: "1"   # fail, not skip, the browser tests when Chromium is missing
        run: pytest -v -rs

  # The note-intake example's robustness grids (K6-R10): the intake spike's three grids (one setting at a time, the 16
  # corners, 40 random draws) on examples/blocks/note-intake's own files, about 8 minutes. It gates on the results,
  # never on time: the target (every one-setting case but the 0 V control passes, at least 14 of the 16 corners) and no
  # soft NOTE reset. Not on the exact counts: a case near the margin can flip on another Python or CPU. The log prints
  # each grid's counts, failing cases and fastest segment, so drift shows there.
  intake-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - name: Install
        run: pip install -e ".[dev]"
      - name: The intake grids
        env:
          MUJOCO_GL: osmesa
          SCRIMMAGE_INTAKE_GRID: "1"
        run: pytest -v -s tests/test_examples_note_intake.py::test_the_intake_grids

  # The Part tab's CAD code (STEP/STL reading, mass, the import file, the server) and the Test tab's blocks (test
  # files, runs, kept runs, sweeps, its server) have to work on the students' Windows laptops too, and so does
  # lockstep (below); the browser tests need Linux's Chromium setup, so they are skipped here. tests/test_mcp_blocks.py is left off because this job
  # doesn't install the mcp extra.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,cad,bench]"
      - name: Test
        shell: bash   # bash expands the test_cad_*.py wildcard; PowerShell would pass it to pytest as is
        env:
          SCRIMMAGE_SKIP_BROWSER: "1"
        run: >
          pytest tests/test_cad_*.py tests/test_part_overlay.py tests/test_part_server.py
          tests/test_blocks_*.py tests/test_range_stations.py tests/test_range_pieces.py tests/test_range_kinds.py
          tests/test_range_rods.py tests/test_range_piece_world.py tests/test_part_grip.py
          tests/test_test_server.py tests/test_hal_drive.py
          tests/test_climb_hooks_any_body.py -v
      # RobotPy LaserCAN on Windows: libgrapplefrc-py's win_amd64 wheel (no bundled HAL, unlike Linux's) through the
      # lockstep helper's stand-in; the import check fails here instead of letting the tests skip themselves
      - name: Install the lockstep extension
        run: pip install ./lockstep
      - name: Check RobotPy, phoenix6, libgrapplefrc and the lockstep extension are importable
        run: python -c "import wpilib, halsim_ws, scrimmage_lockstep, phoenix6, libgrapplefrc"
      # Lockstep on Windows runs a prebuilt DLL committed in the package (lockstep/scrimmage_lockstep/lib/win_amd64).
      # Build it here from source with MSVC (against the HAL RobotPy installed) and test that build: it replaces the
      # DLL in the installed package. Once its tests pass, the 3.13 run uploads it with its stamp as the artifact
      # lockstep/tools/update_windows_dll.py takes after a change to the C++. Last, the committed DLL itself runs.
      - name: Build the lockstep extension from source
        shell: bash
        run: |
          cmake -S lockstep -B build-lockstep -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build build-lockstep --config Release
          mkdir -p lockstep-win-dll
          cp build-lockstep/Release/halsim_scrimmage_lockstep.dll lockstep-win-dll/
          python lockstep/tools/stamp.py --write lockstep-win-dll
      - name: Use the fresh build in the installed package
        run: >
          python -c "import shutil, scrimmage_lockstep as s; p = s.library_path();
          assert p.is_file() and (p.parent / 'SOURCE.sha256').is_file(), f'pip install ./lockstep left out {p}';
          [shutil.copy('lockstep-win-dll/' + f, p.parent) for f in (p.name, 'SOURCE.sha256')]; print(p)"
      # the extension itself, RobotPy REV in lockstep (its identical-physics test skips itself: REV noise isn't pinned
      # on Windows), a RobotPy robot without REV repeating bit for bit, the job object and run-token kill, and the CAN
      # distance sensors
      - name: Test RobotPy lockstep and CAN distance sensors
        shell: bash
        run: >
          pytest tests/test_lockstep_ext.py tests/test_rev_py_e2e.py tests/test_e2e.py::test_runs_are_repeatable
          tests/test_robot_process_windows.py tests/test_lockstep_grapple.py tests/test_distance_py_e2e.py -v -rs
      - name: Upload the Windows lockstep extension
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v5
        with:
          name: lockstep-win-dll
          path: lockstep-win-dll/
          if-no-files-found: error
      # the committed DLL was built from this source (on a Windows checkout's line endings); fails after a C++ change
      # until the artifact above is committed
      - name: Check the committed DLL's stamp
        run: pytest tests/test_lockstep_windows_dll.py -v
      - name: Test the committed DLL
        shell: bash
        run: |
          python -c "import shutil, scrimmage_lockstep as s; p = s.library_path(); shutil.copy('lockstep/scrimmage_lockstep/lib/win_amd64/' + p.name, p.parent)"
          pytest tests/test_lockstep_ext.py -v

  # A Java robot in lockstep on Windows: the init script's Windows path (gradlew.bat, the DLL on HALSIM_EXTENSIONS
  # with Windows' path separator, the JNI HAL loaded before it) on REV's MAXSwerve template, the smallest Java test
  # that checks lockstep stayed engaged. Like the windows job it builds the extension from source and tests that.
  windows-java:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('examples/java_maxswerve/**/*.gradle', 'tests/java_probe/**/*.gradle', '**/vendordeps/*.json', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install
        run: |
          pip install -e ".[dev,nt,mcp]"
          pip install ./lockstep
      - name: Build the lockstep extension from source
        shell: bash
        run: |
          cmake -S lockstep -B build-lockstep -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build build-lockstep --config Release
      - name: Use the fresh build in the installed package
        run: >
          python -c "import shutil, scrimmage_lockstep as s; p = s.library_path();
          assert p.is_file(), f'pip install ./lockstep left out {p}'; shutil.copy('build-lockstep/Release/' + p.name,
          p.parent); print(p)"
      # the test module builds the sim-write guard agent itself (`scrimmage java build` also builds the fast-mode
      # library, which this test doesn't use)
      - name: Java lockstep test
        shell: bash
        run: pytest -v -rs -m java tests/test_java_e2e.py -k test_java_maxswerve_auto_scenario
      - name: Stop Gradle daemons
        if: always()
        shell: cmd
        run: |
          cd examples\java_maxswerve && call gradlew.bat --stop
          cd %GITHUB_WORKSPACE%\tests\java_probe && call gradlew.bat --stop
          exit /b 0

  # Java robots (Phoenix 6, REVLib): needs a JDK 17; downloads WPILib and the vendor libraries (no ~/wpilib on CI)
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('examples/java_swerve/**/*.gradle', 'examples/java_maxswerve/**/*.gradle', 'examples/java_fastmode/**/*.gradle', 'scrimmage/java/fastmode/**/*.gradle', 'tests/java_probe/**/*.gradle', 'tests/rev_probe/**/*.gradle', '**/vendordeps/*.json', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # headless rendering for the swerve scenario's screenshot
      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - name: Install
        run: |
          pip install -e ".[dev,nt,mcp]"
          pip install ./lockstep
          scrimmage java build   # the sim-write guard agent and the fast-mode library
      # the fast-mode library's own tests (Talon-style control, devices); they download WPILib's linux-x86-64 HAL
      # natives from frcmaven
      - name: Fast-mode library tests
        run: cd scrimmage/java/fastmode && ./gradlew test
      - name: Java tests
        env:
          MUJOCO_GL: osmesa
        run: pytest -v -rs -m java
      # don't leave Gradle daemons running (and their caches locked) when the job ends
      - name: Stop Gradle daemons
        if: always()
        run: |
          (cd examples/java_swerve && ./gradlew --stop) || true
          (cd examples/java_maxswerve && ./gradlew --stop) || true
          (cd examples/java_fastmode && ./gradlew --stop) || true
          (cd scrimmage/java/fastmode && ./gradlew --stop) || true
          (cd tests/java_probe && ./gradlew --stop) || true
          (cd tests/rev_probe && ./gradlew --stop) || true

  # The FreeCAD exporter tests run the add-on inside headless FreeCAD (the official AppImage, extracted: runners have
  # no FUSE). Verified headless on a bare ubuntu:24.04 (no extra packages) and against the whole `-m freecad` suite.
  freecad:
    # pinned: the AppImage was verified headless on Ubuntu 24.04; bump it deliberately, not with ubuntu-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FREECAD_VERSION: "1.1.3"
      FREECAD_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: freecad-appimage
          key: freecad-appimage-${{ env.FREECAD_SHA256 }}
      - name: Download FreeCAD
        run: |
          mkdir -p freecad-appimage && cd freecad-appimage
          f=FreeCAD_${FREECAD_VERSION}-Linux-x86_64-py311.AppImage
          if [ ! -f "$f" ]; then
            curl -fsSL -o "$f" "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/$f"
          fi
          echo "${FREECAD_SHA256}  $f" | sha256sum -c -
      - name: Extract FreeCAD
        run: |
          cd freecad-appimage
          chmod +x ./*.AppImage
          rm -rf squashfs-root
          ./*.AppImage --appimage-extract > /dev/null
          echo "SCRIMMAGE_FREECAD_CMD=$PWD/squashfs-root/usr/bin/freecadcmd" >> "$GITHUB_ENV"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check FreeCAD runs headless
        run: |
          echo 'import Part, Mesh, MeshPart, JointObject, UtilsAssembly, Materials; print("freecad ok")' > "$RUNNER_TEMP/probe.py"
          if ! out=$("$SCRIMMAGE_FREECAD_CMD" "$RUNNER_TEMP/probe.py" 2>&1); then rc=1; else rc=0; fi
          echo "$out"
          if [ "$rc" != 0 ] || ! grep -q "freecad ok" <<< "$out"; then
            echo "::error::The extracted FreeCAD ($FREECAD_VERSION AppImage) did not run headless or could not import its Assembly modules; likely a missing system library on this runner image, or the AppImage layout changed (usr/bin/freecadcmd)."
            exit 1
          fi
      - name: FreeCAD tests
        env:
          SCRIMMAGE_SKIP_JAVA: "1"
        run: pytest -v -rs -m freecad
