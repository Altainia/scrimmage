# tests/java_probe under scrimmage: the kitbot world, with Phoenix devices bound to the left wheel joint, and the
# probe's CANranges and LaserCANs looking ahead (this world has no pieces: they read their max_range).
[model]
mjcf = "../models/kitbot.xml"
[robot]
body = "chassis"
[lockstep]
step = 0.005
[robot_program]
command = ["./gradlew", "-I", "{scrimmage_java}/scrimmage.init.gradle", "simulateJava"]
cwd = "."
start_timeout = 180

[[motor]]
name = "probe"
ctre = "TalonFX:1"
joint = "left_center"
motor = "KrakenX60"
gear_ratio = 10.0
neutral = "brake"         # the probe configures NeutralModeValue.Brake
[[motor]]
name = "probe_inv"
ctre = "TalonFX:4"
joint = "right_center"
motor = "KrakenX60"
gear_ratio = 10.0
neutral = "brake"         # the probe configures NeutralModeValue.Brake
[[encoder]]
ctre = "CANcoder:2"
joint = "left_center"
[[gyro]]
ctre = "Pigeon2:3"
body = "chassis"
[[sensor]]
name = "cr5"
kind = "distance"
body = "chassis"
at = [0.41, 0.45, 0.03]
toward = [1, 0, 0]
ctre = "CANrange:5"
[[sensor]]
name = "lc7"
kind = "distance"
body = "chassis"
at = [0.41, 0.15, 0.03]
toward = [1, 0, 0]
grapple = "LaserCAN:7"
[[sensor]]
name = "cr8"
kind = "distance"
body = "chassis"
at = [0.41, -0.15, 0.03]
toward = [1, 0, 0]
ctre = "CANrange:8"
[[sensor]]
name = "lc9"
kind = "distance"
body = "chassis"
at = [0.41, -0.45, 0.03]
toward = [1, 0, 0]
grapple = "LaserCAN:9"
