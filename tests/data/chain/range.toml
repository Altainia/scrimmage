# K5 chain (spec D1): Task 1's thin-bar range (tests/data/thin_bar: the 2024 blue STAGE alone) with
# chain_blue_center a hanging chain (spec D1's example); the other two CHAINS stay 1/2 in bars. One floor ball, far
# from the robot, so the model's last geom is a ball's (a flex contact read by geom -1 would read it).
[range]
name = "K5 chain"
ball = "2026-fuel"
field = { length = 16.541, width = 8.211 }

[climb]
rule = "lowest-rung"
levels = { ONSTAGE = 3 }

[[floor_balls]]
at = [[2.0, 1.5]]             # choice: far from the robot and the STAGE

# In front of chain_blue_center (x 5.7441), facing the STAGE (heading 180).
[start.chain_center]
pose = [6.05, 4.1051, 180.0]   # choice: the spike's start, 0.31 m short of the bar

# The blue STAGE (M 5.5): core center derived from tags 14, 15, 16 (WPI); legs 70.8 in from it (122.62 in apart, LMD sheet 3).
[[element]]
name = "stage_blue_core"
kind = "box"
center = [4.8678, 4.1051]     # source: derived from tags 14, 15, 16 (WPI)
size = [0.91, 0.91, 1.22]     # estimate: the 6-sided core as a box, its faces 0.454 m from center (tags); top about 76 in (MICROPHONE top 88.25 in less its 12 in, M 5.5)
base_height = 0.7176          # source: M 5.5: aluminum surfaces 2 ft 4 1/4 in above the carpet

[[obstacle]]
name = "stage_blue_leg1"       # choice: the leg toward the alliance wall
from = [3.0748, 4.1051, 0.15]   # source: derived: the truss foot (LMD sheet 3: near foot 120.5 / 121.0 in from the wall)
to = [4.3678, 4.1051, 1.85]    # estimate: the truss leans in to the core top; member sizes are CAD-ONLY
width = 0.25                   # estimate: member sizes are CAD-ONLY

[[obstacle]]
name = "stage_blue_leg2"       # choice: the leg on the AMP side
from = [5.7643, 5.6578, 0.15]   # source: derived: the truss foot (LMD sheet 3: near foot 120.5 / 121.0 in from the wall)
to = [5.1178, 4.5381, 1.85]    # estimate: the truss leans in to the core top; member sizes are CAD-ONLY
width = 0.25                   # estimate: member sizes are CAD-ONLY

[[obstacle]]
name = "stage_blue_leg3"       # choice: the leg on the SOURCE side
from = [5.7643, 2.5524, 0.15]   # source: derived: the truss foot (LMD sheet 3: near foot 120.5 / 121.0 in from the wall)
to = [5.1178, 3.6721, 1.85]    # estimate: the truss leans in to the core top; member sizes are CAD-ONLY
width = 0.25                   # estimate: member sizes are CAD-ONLY

[[element]]
name = "chain_blue_center"
kind = "chain"
center = [5.7441, 4.1051]     # source: M 5.5: the chain rests 1 ft 4 5/8 in from the core's face; face direction from the tags
yaw_deg = 90.0                # source: along the core's face (WPI tags)
span = 2.42                   # source: K4's GE-24205, the CHAIN: 2.42 m across
top = 1.18                    # source: K4's GE-24205: the ends 1.18 m up
low = 0.7176                  # source: M 5.5: lowest point 2 ft 4 1/4 in, unloaded
diameter_in = 0.5             # estimate: 1/4 in chain links, about 1/2 in across
level = "ONSTAGE"

[[element]]
name = "chain_blue_left"
kind = "bar"
center = [4.4297, 4.8640]   # source: M 5.5: the chain rests 1 ft 4 5/8 in from the core's face; face direction from the tags
yaw_deg = 210.0                # source: along the core's face (WPI tags)
length = 1.5                   # estimate: the chain's straight-ish middle; really a 1/4 in chain hung from 48 in at the legs
diameter_in = 0.5              # estimate: 1/4 in chain links, about 1/2 in across
height = 0.7176                # source: M 5.5: lowest point 2 ft 4 1/4 in; a rigid bar does not sag or swing
posts = false
level = "ONSTAGE"

[[element]]
name = "chain_blue_right"
kind = "bar"
center = [4.4297, 3.3462]   # source: M 5.5: the chain rests 1 ft 4 5/8 in from the core's face; face direction from the tags
yaw_deg = 330.0                # source: along the core's face (WPI tags)
length = 1.5                   # estimate: the chain's straight-ish middle; really a 1/4 in chain hung from 48 in at the legs
diameter_in = 0.5              # estimate: 1/4 in chain links, about 1/2 in across
height = 0.7176                # source: M 5.5: lowest point 2 ft 4 1/4 in; a rigid bar does not sag or swing
posts = false
level = "ONSTAGE"
