# The kitbot world, with tests/fake_robot_main.py standing in for the robot program.
[model]
mjcf = "models/kitbot.xml"
timestep = 0.001

[robot]
body = "chassis"
start_pose = [2.0, 4.035, 0.0]

[lockstep]
step = 0.005

[robot_program]
command = ["{python}", "fake_robot_main.py", "--lockstep", "--drive"]
cwd = "."
start_timeout = 15

[[motor]]
name = "left_drive"
pwm = 0
joint = "left_center"
motor = "CIM"
count = 2
gear_ratio = 10.71

[[motor]]
name = "right_drive"
pwm = 1
joint = "right_center"
motor = "CIM"
count = 2
gear_ratio = 10.71
invert = true
