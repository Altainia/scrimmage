# Presets for the disc models: [disc.*] discs and [aero.*] aerodynamic coefficient sets. SI units throughout.
#
# Every value has a `# source:` comment, or a `# estimate:` comment saying how it was estimated.
# Estimates are NOT measurements. Inertia can be measured with a bifilar pendulum and rim stiffness with two plates
# and a scale; replace them with your numbers.
#
# Sources:
#   MAN-2   2013 FRC Game Manual, Section 2 "The Arena", rev. 1/8/13.
#   HUM03   S. A. Hummel, "Frisbee Flight Simulation and Throw Biomechanics", MS thesis, UC Davis, 2003. Page numbers
#           are the thesis's printed ones (App. A, simulate_flight.m, is pp. 81-87; App. B, discfltEOM.m, pp. 88-90).
#   HH-ADD  M. Hubbard and S. A. Hummel, "Addendum to Simulation of Frisbee Flight", which quotes the coefficients of
#           Hummel and Hubbard, "Identification of Frisbee aerodynamic coefficients using flight data", ISEA 2002.
#
# Disc fields: diameter (m), mass (kg), height (m, overall), izz (kg m^2, about the spin axis), ixx (kg m^2, about a
# diameter; Iyy is the same), rim_stiffness (N/m, the rim's radial spring when squeezed by a wheel),
# rim_damping_ratio (the damping ratio of that spring against the disc's mass).

[disc.2013-frisbee]
# FRC 2013 ULTIMATE ASCENT disc: Wham-O part 53214, a domed-top Frisbee.
diameter = 0.2794           # source: MAN-2 §2.2.10, "nominal diameter of 11 in."
mass = 0.180                # source: MAN-2 §2.2.10, "a weight of 180 ± 5 grams"
height = 0.0356             # source: MAN-2 §2.2.10, "a nominal height of 1.4 in."
izz = 0.0026                # estimate: Ultra-Star scaled by m d^2: 0.00235 (HUM03 Table 3-1) x (0.180/0.175) x (0.2794/0.269)^2 = 0.00261. Not measured; the domed top may differ.
ixx = 0.00135               # estimate: Ultra-Star scaled by m d^2: 0.00122 (HUM03 Table 3-1) x (0.180/0.175) x (0.2794/0.269)^2 = 0.00135. Not measured.
rim_stiffness = 5000.0      # estimate: a polyethylene rim lip about 10-12 mm thick squeezed radially; judged by hand, not measured. Measure with two plates and a scale.
rim_damping_ratio = 0.25    # estimate: a linear spring-damper with this ratio bounces with restitution exp(-pi z / sqrt(1 - z^2)) = 0.44, inside the 0.3-0.5 guessed for a disc on polycarbonate. Not measured.

[disc.ultra-star]
# Discraft Ultra-Star, the 175 g Ultimate disc that Hummel flew and that his coefficients describe.
diameter = 0.269            # source: HUM03 Table 3-1 (p. 35); the code's d = 2 sqrt(A/pi) with A = 0.057 m^2 is 0.2694 (p. 81)
mass = 0.175                # source: HUM03 Table 3-1 (p. 35)
height = 0.032              # estimate: about 32 mm, the Ultra-Star's usual rim height; the thesis gives none
izz = 0.00235               # source: HUM03 Table 3-1 (p. 35); the code uses Ia = 0.002352 (p. 81)
ixx = 0.00122               # source: HUM03 Table 3-1 (p. 35); the code uses Id = 0.001219 (p. 81)
rim_stiffness = 5000.0      # estimate: taken equal to the 2013 disc's; not measured
rim_damping_ratio = 0.25    # estimate: taken equal to the 2013 disc's; not measured

# Aerodynamic coefficient sets, in the forms of Hummel's code (HUM03 App. A/B; see scrimmage/disc/aero.py):
#   form = "potts-crowther": C_L, C_D, C_M against alpha and C_Rr against (alpha, advance ratio) from Potts and
#          Crowther's (2002) tables, embedded in HUM03 pp. 82-83 and kept in aero.py. Roll R = q A d (C_Rr + C_Rp p).
#   form = "linear": C_L = cl0 + cla a; C_D = cd0 + cda (a - a0)^2, a0 = -cl0/cla; C_M = cm0 + cma a;
#          roll R = q A d (sqrt(d/g) crr r + crp p).
# Both: pitch M = q A d (C_M + cmq q); spin-down N = cnr r (no q A d factor). Rates in rad/s.
# flat_plate_cd is the drag of the disc broadside to the flow (alpha 90 deg), used beyond the tables.

[aero.pc-long]
# Hummel's recommendation (HUM03 §3.5): Potts and Crowther's tables with the long-flight (f2302) damping.
form = "potts-crowther"     # source: HUM03 App. A, CoefUsed = 2 (pp. 81, 85-86)
cmq = -0.0144               # source: HUM03 p. 82, "CMq= -1.44E-02" (long flight f2302); Table 3-2 rounds it to -1.4E-2
crp = -0.0125               # source: HUM03 p. 82, "CRp =-1.25E-02" (long flight f2302); Table 3-2 rounds it to -1.3E-2
cnr = -3.41e-5              # source: HUM03 p. 82, "CNr = -3.41E-05" (long flight f2302); Table 3-2 rounds it to -3.4E-5
flat_plate_cd = 1.17        # source: the drag of a flat disc broadside to the flow, Hoerner "Fluid-Dynamic Drag" (1965) ch. 3

[aero.hummel-short]
# Hummel's own fit to three short flights (HUM03 Table 3-2, p. 39), at the code's full precision.
form = "linear"             # source: HUM03 App. A, CoefUsed = 1 (pp. 85, 89)
cl0 = 0.3331                # source: HUM03 p. 82 (Table 3-2: 0.33)
cla = 1.9124                # source: HUM03 p. 82 (Table 3-2: 1.91)
cd0 = 0.1769                # source: HUM03 p. 82 (Table 3-2: 0.18)
cda = 0.685                 # source: HUM03 p. 82 (Table 3-2: 0.69)
cm0 = -0.0821               # source: HUM03 p. 82 (Table 3-2: -0.08)
cma = 0.4338                # source: HUM03 p. 82 (Table 3-2: 0.43)
crr = 0.00171               # source: HUM03 p. 82, in the sqrt(d/g) form; Table 3-2's 1.4E-2 is the same fit in another non-dimensionalization (the code's comment)
cmq = -0.005                # source: HUM03 p. 82 (commented-out short-flight line) and Table 3-2
crp = -0.0055               # source: HUM03 p. 82 and Table 3-2
cnr = -7.1e-6               # source: HUM03 Table 3-2 (p. 39). The code's commented-out line (p. 82) has +7.1e-6, which would spin the disc up; the table's sign is used.
flat_plate_cd = 1.17        # source: Hoerner "Fluid-Dynamic Drag" (1965) ch. 3, as for pc-long

[aero.hh02]
# Hummel and Hubbard (2002), "Four Flights", as quoted in HH-ADD. A closed-form alternative.
form = "linear"             # estimate: HH02's form is taken to be the thesis code's linear form (CoefUsed = 1)
cl0 = 0.188                 # source: HH-ADD, Four Flights
cla = 2.37                  # source: HH-ADD, Four Flights
cd0 = 0.15                  # source: HH-ADD, Four Flights
cda = 1.24                  # source: HH-ADD, Four Flights
cm0 = -0.06                 # source: HH-ADD, Four Flights
cma = 0.38                  # source: HH-ADD, Four Flights
crr = 0.0004                # source: HH-ADD, Four Flights; applied in the thesis code's sqrt(d/g) form, an estimate of HH02's own form
cmq = 0.0008                # source: HH-ADD, Four Flights, sign as printed (a positive C_Mq slightly undamps pitch)
crp = -0.013                # source: HH-ADD, Four Flights
cnr = -2.8e-5               # source: HH-ADD, Four Flights
flat_plate_cd = 1.17        # source: Hoerner "Fluid-Dynamic Drag" (1965) ch. 3, as for pc-long

[aero.none]
# No aerodynamics at all: every coefficient zero, so a disc flies a parabola and keeps its angular momentum.
form = "linear"             # source: a test set; with every coefficient zero the form does not matter
flat_plate_cd = 0.0         # source: a test set, zero by definition

# Disc-launcher wheels ([wheels] preset = "<name>"), the launcher's `Wheels` fields: diameter (m), width (m, tread
# width), durometer (Shore A, which sets the tread's contact stiffness, launcher/contact.py `wheel_stiffness`) and
# friction (tread against the disc's polyethylene rim).
#   CD-BLUE  Chief Delphi, "1114 and 2056's shooter wheels" (2013), quoting McMaster-Carr 2477K36.
#   CD-PHYS  Chief Delphi, "Shooting Physics" (2013), Sparks333 with Ether's correction.
# Friction of these treads on polyethylene is not published; the planning ranges are in docs/disc.md, Sources.

[wheels.urethane-60a-4in]
# The 2013 "blue roller": McMaster 2477K36 large-bore urethane drive roller, used by 254, 973, 1114, 2056 and others.
diameter = 0.1016           # source: CD-BLUE, McMaster 2477K36 "4" Diameter"
width = 0.0234              # source: CD-BLUE, McMaster 2477K36 "0.92" W"
durometer = 60.0            # source: CD-BLUE, McMaster 2477K36 "60A Durometer"
friction = 0.8              # estimate: middle of 0.6-1.0, soft urethane on polyethylene (docs/disc.md, Sources). Not measured.

[wheels.pneumatic-8in]
# AndyMark 8 in pneumatic wheel (am-0970 class), used on 2013 shooters (Chief Delphi "Disc Lauching Velocity", CD-VEL).
diameter = 0.2032           # source: CD-PHYS, "8" AndyMark pneumatic" (r = 0.1016 m)
width = 0.044               # estimate: about 1.75 in tread width for an 8 in AndyMark pneumatic; not checked against a drawing
durometer = 60.0            # estimate: a rubber tire tread. A tire's stiffness is set by its pressure (10-40 kN/m, docs/disc.md, Sources), not its tread: set [layout] wheel_stiffness for a measured tire.
friction = 0.75             # estimate: middle of 0.6-0.9, pneumatic rubber tread on polyethylene (docs/disc.md, Sources). Not measured.

# Fence (backing) surfaces ([layout] fence = "<name>"): friction against the disc's rim. Not published for
# polyethylene; the planning ranges are in docs/disc.md, Sources, taken from Chief Delphi reports of what teams used.

[fence.wedgetop]
friction = 1.0              # estimate: middle of 0.8-1.2, wedgetop or rough-top tread on polyethylene (docs/disc.md, Sources)

[fence.rubber-tape]
friction = 0.8              # estimate: middle of 0.6-1.0, soft rubber (self-fusing tape, "squishy tape") on polyethylene (docs/disc.md, Sources)

[fence.polycarbonate]
friction = 0.28             # estimate: middle of 0.2-0.35, bare polycarbonate or aluminum on polyethylene (docs/disc.md, Sources)

[fence.ptfe]
friction = 0.15             # estimate: middle of 0.1-0.2, Delrin or PTFE tape on polyethylene (docs/disc.md, Sources)
