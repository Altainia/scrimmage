# Presets for the launcher model. A setup section may say `preset = "<name>"`; the preset fills the section and
# explicit keys override it. Sections: [ball.*], [wheels.*], [air.*], [surface.*], [piece.*]. SI units throughout.
# The [surface.*] and [piece.*] tables are for the test range's rigid game pieces (docs/test-range.md); lengths are
# written in inches (`_in`) where the manual gives inches.
#
# Every value has a `# source:` comment, or a `# estimate:` comment saying how it was estimated.
# Estimates are NOT measurements. Ball stiffness and restitution and wheel friction can all be measured at home
# (see docs/launcher.md); replace them with your numbers.
#
# Ball fields: diameter (m), mass (kg), stiffness_n (N to compress the ball by 25% of its diameter between flat
# plates), stiffness_exponent (force grows as compression^exponent; 1.5 is the Hertz contact law),
# restitution (bounce coefficient from a drop on a hard floor), inertia_factor (moment of inertia over
# mass * radius^2).

[ball.2020-power-cell]
# FRC 2020 Infinite Recharge "Power Cell": yellow medium-bounce dino-skin foam ball.
diameter = 0.1778       # source: 7 in., FRC 2020 Game Overview (Team 245 summary of the 2020 manual) https://www.adambots.com/wp-content/uploads/2021/11/Infinite_Recharge_2020_Game_Overview_Team245.pdf
mass = 0.1417           # source: about 5 oz, AndyMark replica listing https://www.andymark.com/products/infinite-recharge-power-cell (the replica is described as a close approximation; the manual's own figure was not found)
stiffness_n = 60.0      # estimate: a soft hand-squeezable foam ball; about 60 N for a quarter-diameter squeeze judged by hand. No published force or compression figure was found for the Power Cell (searched 2026-10-28). For comparison with foam data: a Hertz sphere squeezed between plates, F = (4/3) E/(1 - nu^2) sqrt(D/2) (delta/2)^1.5, gives 60 N at delta = D/4 for E/(1 - nu^2) = 46 kPa. Not measured. THE most influential input (it sets the grip limit): measure it with a bathroom scale and two boards (docs/launcher.md).
restitution = 0.6       # estimate: "medium bounce" foam (the manual's wording); no published number. Measure with a drop test.
inertia_factor = 0.4    # estimate: a uniform solid sphere, 2/5; a foam ball is near-uniform throughout.

[ball.2022-cargo]
# FRC 2022 Rapid React "Cargo": oversized fuzzy tennis ball, inflated to 3.5 psi.
diameter = 0.2413       # source: 9.5 in., FRC 2022 Game Overview (Team 245 summary of the 2022 manual) https://www.adambots.com/wp-content/uploads/2022/01/FRC-Game-Overview-Rapid-React-Adambots-FRC245.pdf
mass = 0.2693           # source: 9.5 oz., same document
stiffness_n = 500.0     # estimate: gauge pressure (3.5 psi = 24 kPa, from the manual) times the contact-patch area at a 25% squeeze (about 0.023 m^2) is about 550 N; rounded down because the patch is not a flat disc. Shell stiffness ignored. Not measured.
restitution = 0.87      # source: derived from the manual, which says a 3 ft drop on carpet bounces to 2 ft 1 in. to 2 ft 6 in. (bottom of ball), so e = sqrt(h/H) = 0.83 to 0.91; midpoint 0.87. Carpet, not a hard floor, so a hard-floor drop may bounce a little higher.
inertia_factor = 0.667  # estimate: a thin inflated shell, 2/3 (the felt cover and rubber bladder carry the mass).

[ball.2026-fuel]
# FRC 2026 REBUILT "FUEL": high density polyurethane foam ball.
diameter = 0.1501       # source: 5.91 in., AndyMark https://andymark.com/collections/first%C2%AE-robotics-competition-2026-rebuilt/products/official-rebuilt-fuel
mass = 0.2164           # source: average of AndyMark's in-line production inspection samples, 216.4 g, in the 2026 scoring element whitepaper https://community.firstinspires.org/hubfs/blog/frc/2026-scoring-element-whitepaper-am.pdf (AndyMark lists 0.448 to 0.5 lb, 203 to 227 g; the whitepaper's design target was about 200 g)
stiffness_n = 80.0      # estimate: judged as a firmer foam than the Power Cell (a Hertz sphere between plates gives 80 N at delta = D/4 for E/(1 - nu^2) = 85 kPa). The whitepaper above charts "spring rate" (production nominal 20, Figs. 7 and 10; aged balls 30 to 38, Fig. 10) and "deflection under a weight" (0.625 in. for 200 g balls, Table 1) without units or the load, so no force at 25% can be read from it. IF the spring rate were lbf/in. measured as a straight line, 20 lbf/in. over a quarter-diameter squeeze (1.48 in.) would be about 130 N, and an aged ball about 200 N: so 80 N may be low. Chief Delphi FUEL threads (Fuel Variance Testing, Fuels with different hardness) report only qualitative hardness differences. Not measured; measure your own.
restitution = 0.6       # estimate: no published bounce figure; assumed equal to the Power Cell's. Measure with a drop test.
inertia_factor = 0.4    # estimate: a uniform solid sphere, 2/5; high density foam throughout.

[ball.2016-boulder]
# FRC 2016 STRONGHOLD "Boulder": 10 in. gray coated-foam ball (the 2016 Kit of Parts ball).
diameter = 0.254        # source: 10 in., FRC 2016 game manual, as quoted in https://www.chiefdelphi.com/t/2016-boulder-weight-issue/147506 (where teams measured boulders at 9.6 to 9.7 in.)
mass = 0.285            # estimate: the same Chief Delphi thread (https://www.chiefdelphi.com/t/2016-boulder-weight-issue/147506) reports gray boulders at 281 to 300 g (an official one 292 g, a kit ball 281 g, a gray one at 300 g) and some other makers' balls up to 388 g; 285 g is taken from the gray ones. The manual's own mass was not confirmed.
stiffness_n = 120.0     # estimate: a coated foam ball much firmer than the Power Cell. The thread above reports forces to compress a ball to 8 in. (about 6.3 kg-force for a kit ball, 11 to 13 kg-force for newer ones), a 2 in. squeeze on a 10 in. ball, not the 25% of this field, and not converted. Not measured.
restitution = 0.5       # estimate: coated foam that bounces less than the Power Cell; no published number. Measure with a drop test.
inertia_factor = 0.4    # estimate: a uniform solid sphere, 2/5; solid foam throughout.

[ball.2017-fuel]
# FRC 2017 STEAMWORKS "Fuel": 5 in. high-visibility yellow foam ball.
diameter = 0.127        # source: 5 in. (nominal), FRC 2017 game manual
mass = 0.0737           # source: 2.6 oz., FRC 2017 game manual
stiffness_n = 60.0      # estimate: a small low-density foam ball, taken equal to the Power Cell's 60 N. No published figure. Not measured.
restitution = 0.5       # estimate: low-density foam; no published number. Measure with a drop test.
inertia_factor = 0.4    # estimate: a uniform solid sphere, 2/5; foam throughout.

[ball.2019-cargo]
# FRC 2019 Destination: Deep Space "Cargo": 13 in. orange inflated rubber ball.
diameter = 0.3302       # source: 13 in. +/- 0.5 in., FRC 2019 game manual
mass = 0.280            # estimate: about 9.9 oz, remembered from a hollow rubber playground ball of this size; the manual's mass was not confirmed. Replace with a kitchen-scale reading.
stiffness_n = 250.0     # estimate: a lightly inflated hollow rubber ball; the squeeze force comes mostly from pressure over the contact patch (as for the 2022 Cargo). No published figure. Not measured.
restitution = 0.7       # estimate: a hollow rubber ball; no published number. Measure with a drop test.
inertia_factor = 0.667  # estimate: a thin inflated shell, 2/3.

[ball.2025-algae]
# FRC 2025 REEFSCAPE "Algae": 16 in. blue-green inflated foam-and-rubber ball.
diameter = 0.4064       # source: 16 in., Wikipedia (Reefscape) https://en.wikipedia.org/wiki/Reefscape ; the 2025 game manual's figure was not confirmed
mass = 0.450            # estimate: about 1 lb. The manual's mass was not confirmed. Replace with a kitchen-scale reading.
stiffness_n = 200.0     # estimate: a large lightly inflated ball, squeezed by hand much like the 2022 Cargo. No published figure. Not measured.
restitution = 0.7       # estimate: a hollow inflated ball; no published number. Measure with a drop test.
inertia_factor = 0.667  # estimate: a thin inflated shell, 2/3.

[ball.2014-ball]
# FRC 2014 Aerial Assist "Ball": the large inflated exercise ball (about 25 in.) with a soft cover.
diameter = 0.635        # source: 25 in., the bladder size reported in the Chief Delphi thread https://www.chiefdelphi.com/t/ball-dimensional-variability/132470 (one team measured a ball at up to about 25.75 in.); the 2014 manual says only "approximately 2 ft" (24 in.)
mass = 1.3              # estimate: a forum figure, unconfirmed. Replace with a scale reading.
stiffness_n = 300.0     # estimate: a large inflated vinyl ball squeezed over a big patch; pressure is low, so about the same as the 2022 Cargo's. No published figure. Not measured.
restitution = 0.8       # estimate: a large inflated ball; no published number. Measure with a drop test.
inertia_factor = 0.667  # estimate: a thin inflated shell, 2/3.

[ball.2010-soccer-ball]
# FRC 2010 Breakaway "Soccer ball": a size 5 soccer ball (also the 2002 Zone Zone piece).
diameter = 0.2223       # source: 27 to 28 in. circumference in the FRC 2010 game manual, midpoint 27.5 in. / pi = 8.75 in. = 0.2223 m
mass = 0.425            # source: 14 to 16 oz in the FRC 2010 game manual, midpoint 15 oz = 0.425 kg
stiffness_n = 300.0     # estimate: an inflated soccer ball (about 8 to 16 psi); pressure times a contact patch at a 25% squeeze gives several hundred N. Not measured.
restitution = 0.8       # estimate: a regulation soccer ball dropped on a hard floor rebounds about 0.6 to 0.7 of its drop height by FIFA's test (e about 0.8); not looked up for this entry. Measure with a drop test.
inertia_factor = 0.667  # estimate: a thin inflated shell, 2/3.

[ball.2012-basketball]
# FRC 2012 Rebound Rumble "Basketball": 8 in. FIRST-logo foam basketball (size 4).
diameter = 0.2021       # source: 25 in. circumference / pi = 7.96 in. = 0.2021 m, FRC 2012 game manual section 2.2.11
mass = 0.3175           # source: "approximate weight of 11.2 oz", FRC 2012 game manual section 2.2.11; 11.2 oz = 0.3175 kg
stiffness_n = 100.0     # estimate: a coated foam ball, firmer than the Power Cell but not as firm as the 2016 Boulder. No published figure. Not measured.
restitution = 0.55      # estimate: coated foam; no published number. Measure with a drop test.
inertia_factor = 0.4    # estimate: a uniform solid sphere, 2/5; foam throughout.

# Shooter-wheel materials by Shore A durometer. Fields: durometer, friction (coefficient against the ball).
# Friction is not published for these materials against FRC foam and felt balls. The trend used for every entry:
# softer rubber grips more. Values are estimates for polyurethane/rubber on a fuzzy or foam surface; they are
# for the model's first runs and should be replaced by a sled-pull measurement of your own wheel and ball.

[wheels.30A]
durometer = 30.0        # source: the preset name (Shore A)
friction = 1.0          # estimate: top of the 0.5 to 1.0 range typical for rubber on foam; softest wheel grips most.

[wheels.35A]
durometer = 35.0        # source: the preset name (Shore A)
friction = 0.95         # estimate: interpolated between the 30A and 40A entries.

[wheels.40A]
durometer = 40.0        # source: the preset name (Shore A)
friction = 0.9          # estimate: interpolated, midway between the 30A and 60A entries along the same trend.

[wheels.45A]
durometer = 45.0        # source: the preset name (Shore A)
friction = 0.85         # estimate: interpolated between the 40A and 60A entries.

[wheels.60A]
durometer = 60.0        # source: the preset name (Shore A)
friction = 0.7          # estimate: harder rubber, lower grip; low end of the typical range.

# Air. density in kg/m^3; flight uses drag = 1/2 rho A Cd v^2 and a lift force on the spinning ball,
# F = 1/2 rho A C_L v^2, with C_L = lift_slope * S up to lift_max, where S = spin surface speed / ball speed.
[air.default]
density = 1.2           # source: dry air at 20 C and sea level, 1.204 kg/m^3 (International Standard Atmosphere is 1.225 at 15 C), rounded
drag_coefficient = 0.47 # source: smooth sphere in the sub-critical range, Hoerner "Fluid-Dynamic Drag" and NASA Glenn "Drag of a Sphere" https://www.grc.nasa.gov/www/k-12/VirtualAero/BottleRocket/airplane/sphere.html (a fuzzy or foam ball is rougher, so a little higher in practice)
lift_slope = 1.0        # estimate: wind-tunnel studies of spinning sports balls (Mehta 1985, "Aerodynamics of Sports Balls", Annu. Rev. Fluid Mech.) show C_L rising roughly in proportion to S for S below about 0.3. Not measured for FRC balls.
lift_max = 0.3          # estimate: the same studies show C_L leveling off near 0.25 to 0.35 at higher S.

# Surface materials for rigid pieces. A piece's `material` names one; friction is the sliding coefficient of the
# piece's surface against a hard plastic or metal robot part (the bench's materials, scrimmage/bench/presets.toml,
# use the same footing: its polycarbonate 0.4 and nitrile rubber 0.8 `rigid_friction` are repeated here so the two
# tables can't disagree). Friction against FRC pieces is not published; every value is an estimate. Replace
# with a sled-pull measurement of your own part and piece.
# Published figures read for this table (Engineering ToolBox, https://www.engineeringtoolbox.com/friction-coefficients-d_778.html,
# clean and dry): polyethylene on polyethylene 0.2, polystyrene on polystyrene 0.5, Plexiglas on Plexiglas 0.8,
# rubber on dry concrete 0.6 to 0.85, rubber on cardboard 0.5 to 0.8. It lists no PVC, polypropylene or polycarbonate.

[surface.pvc]
friction = 0.4          # estimate: hard smooth plastic on plastic, between that page's polyethylene (0.2) and polystyrene (0.5); the same 0.4 as the bench's smooth-plastic entry.

[surface.polycarbonate]
friction = 0.4          # estimate: smooth plastic on plastic; equal to the bench's polycarbonate rigid_friction (scrimmage/bench/presets.toml), which is itself an estimate (0.3 to 0.5 typical).

[surface.rubber]
friction = 0.8          # estimate: rubber on a hard surface, in the lower half of that page's rubber ranges (0.5 to 0.85); equal to the bench's nitrile rigid_friction.

[surface.foam]
friction = 0.6          # estimate: coated foam grips about like a firm rubber but less; between the plastics (0.4) and rubber (0.8).

[surface.hdpe]
friction = 0.25         # estimate: a waxy plastic, a little above that page's polyethylene on polyethylene (0.2).

[surface.polypropylene]
friction = 0.3          # estimate: polypropylene is a waxy plastic like polyethylene but a little harder; between hdpe (0.25) and PVC (0.4).

[surface.fabric]
friction = 0.5          # estimate: a smooth PVC fabric cover against plastic, the bottom of that page's rubber on cardboard range (0.5 to 0.8) since it is not rubber.

# Rigid game pieces (the test range's `[piece.*]`; see scrimmage/testrange/pieces.py). A piece names its shape(s), mass
# (kg) and `material` (a [surface.*] above). Lengths are `_in` (inches). A piece's display name drops the year ("2025-coral"
# is "coral").

[piece.2025-coral]
# FRC 2025 REEFSCAPE "Coral": a 4 in nominal PVC pipe, 11 7/8 in long: a hollow tube.
shape = "tube"          # source: FRC 2025 game manual section 5.7.1 (CORAL): "a 11 7/8 in. long piece of 4 in. diameter Schedule 40 Cellular (Foam) Core PVC pipe" https://firstfrc.blob.core.windows.net/frc2025/Manual/2025GameManual.pdf
diameter_in = 4.5       # source: same section: "a 4 1/2 in. (~11 cm) outside diameter" (4.500 in is the OD of any 4 in nominal Schedule 40 pipe)
inner_diameter_in = 4.0 # source: same section: "a 4-in. (~102 mm) inside diameter" (a Sch 40 solid-wall 4 in pipe is 4.026 in; the manual's 4.0 is used for this foam core pipe)
length_in = 11.875      # source: same section, 11 7/8 in.
mass = 0.658            # estimate: the manual says CORAL "has a weight of between 1.1-1.8 lbs. (~0.5-0.8 kg)"; the midpoint, 1.45 lb = 0.658 kg. Weigh yours.
material = "pvc"        # source: the manual calls it PVC pipe; its friction is the estimate in [surface.pvc]

[piece.2023-cone]
# FRC 2023 Charged Up "Cone": a yellow rubber marker cone on a square base, tip up. A square slab and a frustum.
shape = "compound"      # source: FRC 2023 game manual section 5.8.1: a rubber marker cone, Flaghouse 4158 (the manual's figure is not dimensioned beyond the numbers below) https://uploads-ssl.webflow.com/599637fe3f1ad60001ccbba1/63c344503b2b7643a59facad_2023FRCGameManual.pdf
mass = 0.652            # source: same section, "weighs 1lb 7oz (~653 g)"; 1 lb 7 oz = 0.6522 kg
material = "rubber"     # source: same section, "rubber marker cone"; its friction is the estimate in [surface.rubber]

# Base slab and feet: the manual gives an 8 3/8 in. +/- 1/8 in. square base with 1/4 in. tall feet. The cone is 1 ft 13/16 in. (12.8125 in.) tall.
[[piece.2023-cone.shapes]]
shape = "box"           # estimate: the 8 3/8 in square base from the manual, but the slab thickness (0.75 in, with the feet) is a guess from the photograph; the manual gives no base thickness.
size_in = [8.375, 8.375, 0.75]  # source: manual section 5.8.1 for the 8 3/8 in square; estimate: the 0.75 in thickness
pos_in = [0.0, 0.0, 0.375]      # estimate: the slab sits on the floor, its middle half its thickness up

# The cone body: from the slab's top (0.75 in) to the manual's 12.8125 in height.
[[piece.2023-cone.shapes]]
shape = "cone"         # estimate: a frustum; the manual gives no body shape or mass distribution
diameter_in = 7.0      # estimate: a base diameter a little inside the 8 3/8 in slab, from the photograph; not dimensioned in the manual
tip_diameter_in = 1.25 # estimate: the flat top of the cone with its stacking hole, from the photograph; not dimensioned in the manual
length_in = 12.0625    # source: manual 12.8125 in. height minus the 0.75 in slab (estimate)
pos_in = [0.0, 0.0, 6.78125]   # estimate: the middle of the body, 0.75 + 12.0625 / 2 in up

[piece.2023-cube]
# FRC 2023 Charged Up "Cube": a purple PVC fabric inflatable cube. A rigid stand-in for an inflated fabric cube (the real one squashes).
shape = "box"           # source: FRC 2023 game manual section 5.8.2: "inflated to 9 1/2 in. +/- 1/4 in. ... face to face", rounded corners, sides not necessarily equal; a sharp-cornered cube here
size_in = [9.5, 9.5, 9.5]       # source: same section
mass = 0.0709           # source: same section: "A CUBE weighs 2.5 oz (~71 g)" (REV and AndyMark say the same; 2.5 oz = 0.0709 kg)
material = "fabric"     # source: same section, "purple PVC fabric"; its friction is the estimate in [surface.fabric]

[piece.2017-gear]
# FRC 2017 STEAMWORKS "Gear": a gold polypropylene toothed wheel, taken as a plain solid disc.
shape = "cylinder"      # source: FRC 2017 game manual section 3.12.2: a toothed wheel; teeth and the center hole are left out here https://firstfrc.blob.core.windows.net/frc2017/Manual/2017FRCGameSeasonManual.pdf
diameter_in = 11.0      # source: same section, "an 11 in. (~28 cm) diameter" (its pitch diameter is 10 in)
length_in = 2.0         # source: same section, "2 in. (~5 cm) thick"
mass = 0.522            # source: same section, "weighs 18.4 oz. (~0.5 kg.)"; 18.4 oz = 0.5216 kg
material = "polypropylene"  # source: same section, "polypropylene"; its friction is the estimate in [surface.polypropylene]

[piece.2019-hatch-panel]
# FRC 2019 Destination: Deep Space "Hatch Panel": a 19 in polycarbonate ring with a 6 in hole.
shape = "ring"          # source: FRC 2019 game manual GAME PIECES section (HATCH PANEL): "a circular 3/16-in. (~5 mm) thick polycarbonate toroid" https://robotics.choate.edu/wp-content/uploads/2020/01/2019FRCGameSeasonManual.pdf (the loop tape on its edge is left out)
diameter_in = 19.0      # source: same section, "outside diameter ... 19 in."
inner_diameter_in = 6.0 # source: same section, "the diameter of the hole ... 6 in."
length_in = 0.1875      # source: same section, 3/16 in. thick
mass = 0.941            # estimate: polycarbonate's density, 1200 kg/m^3, times the ring's volume (pi/4 (19^2 - 6^2) in^2 x 3/16 in = 7.84e-4 m^3); the manual gives no mass, the loop tape is left out
material = "polycarbonate"  # source: same section; its friction is the estimate in [surface.polycarbonate]

[piece.2015-tote]
# FRC 2015 Recycle Rush "Tote": a gray or yellow plastic tote, taken as a solid box (its inertia is a solid box's, an estimate: an empty tote's is higher).
shape = "box"           # source: FRC 2015 game manual section 2.3.1: a rigid plastic tote (Orbis FP243) https://first-a-holics.com/wp-content/uploads/2021/12/2015-Game-Manual.pdf (its handles, ribs and lid are left out)
size_in = [26.9, 16.9, 12.1]    # source: same section, "26.9 in. long, 16.9 in. wide, 12.1 in. tall"
mass = 3.54             # source: same section, "weighs approximately 7.8 lbs"; 7.8 lb = 3.538 kg
material = "hdpe"       # estimate: the manual says only "a rigid plastic"; a molded storage tote like the Orbis is usually HDPE, which was not looked up. Its friction is the estimate in [surface.hdpe]

[piece.2024-note]
# FRC 2024 Crescendo "Note": an orange foam ring. Rigid at rest and in flight; in a range, near a robot it becomes a soft ring of 16 segments that bends and squashes (soft = true, testrange/soft.py).
shape = "ring"          # source: AndyMark Crescendo Note page https://andymark.com/products/crescendo-note: OD 14 in, ID 10 in, 2 in thick, coated foam, "rather squishy / flexible"
diameter_in = 14.0      # source: same page, 14 in. OD
inner_diameter_in = 10.0  # source: same page, 10 in. ID
length_in = 2.0         # source: same page, 2 in. thick
mass = 0.235            # source: same page, "8.3 oz. +/- 0.2 oz."; 8.3 oz = 0.2353 kg
material = "foam"       # source: same page, "coated foam"; its friction is the estimate in [surface.foam]
stiffness = 2000.0      # estimate: the soft-note spike's "soft" foam: how hard it pushes back per meter of squeeze at 25 % of its 2 in thickness, 12.7 N a side between two 4 in rollers; UNCALIBRATED
restitution = 0.3       # estimate: its bounce off the carpet from a 1 m drop, a dead foam thud (about 9 cm); UNCALIBRATED
soft = true             # source: spec D8 (a design choice, not a measurement): rigid at rest and in flight, soft near a robot
