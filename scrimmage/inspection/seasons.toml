# FRC robot size and weight limits by season, in the manual's own units (inches, pounds); spec.py converts them to
# meters and kilograms on load. Every entry has a comment quoting its rule short. Read in each season's final Game
# Manual PDF on 2026-11-14 (docs/superpowers/specs/2026-11-14-robot-inspection-sources.md). A limit with a zone or time
# exception has an `unless`; a limit the season doesn't have is left out. The start reach (no overhang in the
# starting configuration) is 0 in every season; spec.START_ALLOWANCE is its allowance for minor protrusions.

[2013]
manual = "2013 Game Manual (with Team Updates through 2013-01-15)"
url = "https://firstfrc.blob.core.windows.net/frcarchive/2013/2013-game-manual.pdf"
not_checked = [
    "G23-1: while in contact with the pyramid, no reach beyond a vertical plane 54 in. from the pyramid base",
    "the zone exceptions to the match height limit",
]

# R05: "The ROBOT weight may not exceed 120 lbs." (without the battery and its half of the Anderson pair, and without BUMPERS)
[2013.weight]
max_lb = 120
rule = "R05"

# R23: "Each set of BUMPERS (including any fasteners and/or structures that attach them to the ROBOT) must weigh no more than 20 lbs."
[2013.bumper_set]
max_lb = 20
rule = "R23"

# R03-A: "total length of the FRAME PERIMETER sides may not exceed 112 in."
[2013.perimeter]
max_in = 112
rule = "R03-A"

# R04: "In the STARTING CONFIGURATION, no part of the ROBOT may extend outside the vertical projection of the FRAME PERIMETER, with the exception of minor protrusions" (no bumper exception in 2013)
[2013.start_reach]
max_in = 0
rule = "R04"

# R03-C: "height may never exceed 84 in. tall." (2013 has no separate starting height)
[2013.start_height]
max_in = 84
rule = "R03-C"

# G22: height "<= 84 in." if in contact with the carpet in its AUTO ZONE and/or its PYRAMID, otherwise "<= 60 in."
[2013.height]
max_in = 60
rule = "G22"
unless = "on the pyramid or in the auto zone (84 in.)"

# G23: "While not in contact with the PYRAMID, a ROBOT'S horizontal dimensions may never exceed a 54 in. diameter vertical cylinder." (R03-B says the same for the playing configuration)
[2013.diameter]
max_in = 54
rule = "R03-B, G23"

[2016]
manual = "2016 Game Manual (Section 3 V12, Section 4 V17)"
url = "https://firstfrc.blob.core.windows.net/frc2016manuals/GameManual/FRC-2016-game-manual.pdf"
not_checked = [
    "the zone exception to the match height limit",
]

# R5: "The ROBOT weight must not exceed 120 lbs."
[2016.weight]
max_lb = 120
rule = "R5"

# R20: "Each set of BUMPERS ... must weigh no more than 20 lbs."
[2016.bumper_set]
max_lb = 20
rule = "R20"

# R3-A: "total length of the FRAME PERIMETER sides must not exceed 120 in."
[2016.perimeter]
max_in = 120
rule = "R3-A"

# R4: "In the STARTING CONFIGURATION ..., no part of the ROBOT shall extend outside the vertical projection of the FRAME PERIMETER, with the exception of its BUMPERS and minor protrusions"
[2016.start_reach]
max_in = 0
rule = "R4"

# R3-C: "ROBOT STARTING CONFIGURATION height must not exceed 54 in."
[2016.start_height]
max_in = 54
rule = "R3-C"

# G17: "may not exceed 4 ft. 6 in. during the MATCH, except during the final twenty (20) seconds of TELEOP where there is no height limit when a ROBOT is fully contained by the opponent's COURTYARD."
[2016.height]
max_in = 54
rule = "G17"
unless = "in the last 20 seconds of teleop fully inside the opponent's courtyard (no limit)"

# G18, R3-B: "ROBOTS may not extend more than 15 in. beyond their FRAME PERIMETER."
[2016.reach]
max_in = 15
rule = "G18"

[2020]
manual = "2020 Game Season Manual (Section 7 V9, Section 9 V8)"
url = "https://firstfrc.blob.core.windows.net/frc2020/Manual/2020FRCGameSeasonManual.pdf"
not_checked = [
    "the zone exception to the match height limit",
]

# R5: "The ROBOT weight must not exceed 125 lbs. (~56 kg)."
[2020.weight]
max_lb = 125
rule = "R5"

# R23: "Each set of BUMPERS (including any fasteners and/or structures that attach them to the ROBOT) must weigh no more than 15 lbs. (~6 kg)."
[2020.bumper_set]
max_lb = 15
rule = "R23"

# R3: "may not have a FRAME PERIMETER greater than 120 in. (~304 cm)"
[2020.perimeter]
max_in = 120
rule = "R3"

# R2: "In the STARTING CONFIGURATION ..., no part of the ROBOT shall extend outside the vertical projection of the FRAME PERIMETER, with the exception of its BUMPERS and minor protrusions"
[2020.start_reach]
max_in = 0
rule = "R2"

# R3: "may not be more than 45 in. (~114 cm) tall."
[2020.start_height]
max_in = 45
rule = "R3"

# G17: "may not exceed 45 in. (~114 cm) above the carpet during the MATCH, with the exception of ROBOTS intersecting their ALLIANCE'S RENDEZVOUS POINT during the ENDGAME."
[2020.height]
max_in = 45
rule = "G17"
unless = "intersecting its alliance's rendezvous point in the endgame (no limit)"

# G18, R4: "ROBOTS may not extend more than 12 in. (~30 cm) beyond their FRAME PERIMETER."
[2020.reach]
max_in = 12
rule = "G18"

[2022]
manual = "2022 Game Manual (Section 7 V7, Section 9 V10)"
url = "https://firstfrc.blob.core.windows.net/frc2022/Manual/2022FRCGameManual.pdf"
not_checked = [
    "G108: no bumper higher than the high rung for more than a moment",
    "G109: never beyond the purple plane",
    "the hangar zone exception to the match height limit",
]

# R103: "must not exceed 125 lbs. (~56 kg)"
[2022.weight]
max_lb = 125
rule = "R103"

# R407: "Each set of BUMPERS ... no more than 15 lbs. (~6 kg)."
[2022.bumper_set]
max_lb = 15
rule = "R407"

# R104: "FRAME PERIMETER greater than 120 in. (~304 cm)"
[2022.perimeter]
max_in = 120
rule = "R104"

# R102: "STARTING CONFIGURATION - no overhang. In the STARTING CONFIGURATION ..., no part of the ROBOT shall extend outside the vertical projection of the FRAME PERIMETER, with the exception of its BUMPERS and minor protrusions"
[2022.start_reach]
max_in = 0
rule = "R102"

# R104: "may not be more than 4 ft. 4 in. (~132 cm) tall." (52 in. is the conversion)
[2022.start_height]
max_in = 52
rule = "R104"

# G106: height "may not exceed the maximum STARTING CONFIGURATION height (4 ft. 4 in.) unless any part of the ROBOT'S BUMPERS is in its HANGAR ZONE, in which case its height may not exceed 5 ft. 6 in. (~167 cm)."
[2022.height]
max_in = 52
rule = "G106"
unless = "with its bumpers in the hangar zone (66 in.)"

# G107, R105: "ROBOTS may not extend more than 16 in. (~40 cm) beyond their FRAME PERIMETER."
[2022.reach]
max_in = 16
rule = "G107"

