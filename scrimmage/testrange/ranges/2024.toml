# The FRC 2024 CRESCENDO test range, written on a kickoff dry run (2026-11-08) from the game manual (M), the Layout &
# Marking Diagram FE-2024 Rev A (LMD), the WPILib 2024 AprilTag JSON (WPI) and Team 6328's FieldConstants (6328):
# both SPEAKERS (the opening as a goal, the wall and the hood as obstacles), both AMPS, the SUBWOOFERS, the STAGES
# with their CHAINS, the SOURCES feeding NOTES, the 11 staged NOTES and the blue starting zone and WING.
# Coordinates: WPILib field frame (blue alliance wall x = 0, scoring-table guardrail y = 0, z up), meters.
#
# The NOTE is a rigid stand-in for the foam ring (the 2024-note preset): it doesn't squash. A pinch shooter
# (`[shooter] kind = "piece"`) shoots it; the goals count it only when all of it fits through the opening.
# The SPEAKER's hood is an [[obstacle]], not a plate of the goal, so a NOTE's corners can't clip it on the way in.
# The field is the 2024 one (16.541 x 8.211 m, WPI), so y is WPILib's and robot code, tags and paths agree.
#
# Numbers cite their source on their line, or say they are an estimate, derived (worked out from sourced numbers)
# or our choice. A red element is the blue one mirrored across x = 16.541 / 2.

[range]
name = "FRC 2024 CRESCENDO"                  # source: the 2024 game's name, manual title page
field = { length = 16.541, width = 8.211 }   # source: WPI, the 2024 field's length and width

[carpet]
rolling_resistance = 0.07   # estimate: scrimmage's default; NOTEs do not roll anyway (they lie flat)

[piece.note]
preset = "2024-note"        # source: M 5.7: 14 in OD, 10 in ID, 2 in thick, 8.3 oz; a rigid stand-in (the preset cites its own numbers)
color = "orange"

# NOTE staging (M 6.3.4; coordinates LMD sheet 6 / 6328): 3 per WING on spike marks, 5 on the CENTER LINE.
[[floor_balls]]
kind = "note"
at = [[2.8956, 4.1056], [2.8956, 5.5534], [2.8956, 7.0012]]   # source: LMD sheet 6 / 6328: blue WING spikes, x = 114 in
[[floor_balls]]
kind = "note"
at = [[13.6454, 4.1056], [13.6454, 5.5534], [13.6454, 7.0012]]   # source: LMD sheet 6 / 6328: red WING spikes
[[floor_balls]]
kind = "note"
at = [[8.2705, 0.7529], [8.2705, 2.4293], [8.2705, 4.1057], [8.2705, 5.7821], [8.2705, 7.4585]]   # source: LMD sheet 6 / 6328: CENTER LINE, first 29.64 in from the scoring-table border, 66 in apart

