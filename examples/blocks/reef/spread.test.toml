[test]
robot = "grabber-standin.toml"
hopper = ["grabber.jaw_left", "grabber.jaw_right"]
chart = ["grabber.arm"]

[setup]
floor_spread = { distance_in = [40.0], rotation_deg = [0.0, 10.0, 15.0, 20.0, 45.0, 90.0] }

[[block]]
do = "drive"
distance = 0.386
volts = 2.0

[[block]]
do = "spin"
motor = "grabber.jaw_left"
volts = 4.0

[[block]]
do = "spin"
motor = "grabber.jaw_right"
volts = 4.0

[[block]]
do = "wait"
seconds = 1.0

[[block]]
do = "move"
joint = "grabber.arm"
to = -30.0
unit = "deg"

[[block]]
do = "wait_until"
until = { held = { piece = "any", by = "grabber" } }
timeout = 5.0

[[block]]
do = "expect"
that = { held = { piece = "any", by = "grabber" } }
