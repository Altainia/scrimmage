# A hopper written by hand: an open-topped bin over the whole top of the stand-in robot, to catch FUEL fed down the
# human player station's chute. It sits on the chassis's top (drive.top). Every number is our choice. Coordinates:
# x forward, y left, z up, in meters; the origin is at the middle of the chassis's top. Box sizes are full sizes.

[part]
name = "hopper"
format = 1

# The bin: a floor, front and side walls 0.3 m high and a back wall 0.5 m high. The robot faces the station with its
# front bumper at the chute's low end, 0.76 m up: a ball leaves the chute moving toward the robot, comes in over the
# front wall and lands about 0.3 m in. The back wall is the taller one because a ball landing on balls already in the
# bin can bounce up to about 0.4 m above the floor, and over a 0.3 m wall.
[[body]]
name = "bin"
mass = 1.0                    # choice: a polycarbonate bin
geom = [
  { box = [0.64, 0.60, 0.01], pos = [-0.02, 0.0, 0.005], color = [0.75, 0.8, 0.85, 0.6] },    # floor
  { box = [0.01, 0.60, 0.30], pos = [0.30, 0.0, 0.15], color = [0.75, 0.8, 0.85, 0.6] },      # front wall, up to z 0.3
  { box = [0.64, 0.01, 0.30], pos = [-0.02, 0.30, 0.15], color = [0.75, 0.8, 0.85, 0.6] },    # left wall
  { box = [0.64, 0.01, 0.30], pos = [-0.02, -0.30, 0.15], color = [0.75, 0.8, 0.85, 0.6] },   # right wall
  { box = [0.01, 0.60, 0.50], pos = [-0.34, 0.0, 0.25], color = [0.75, 0.8, 0.85, 0.6] },     # back wall, up to z 0.5
]

[[mount]]
name = "base"
body = "bin"
