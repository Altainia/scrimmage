[test]
robot = "climber-standin.toml"
chart = ["c.stage1", "hook_load", "tilt"]

[[block]]
do = "move"
joint = "c.stage1"
to = 0.14
unit = "m"

[[block]]
do = "drive"
distance = 0.31
volts = 1.5

[[block]]
do = "move"
joint = "c.stage1"
to = 0.0
unit = "m"

[[block]]
do = "wait_until"
until = { touch = { robot = "hook", field = "chain_blue_center" } }

[[block]]
do = "wait"
seconds = 5.0

[[block]]
do = "expect"
that = { level = "ONSTAGE" }

[[block]]
do = "expect"
that = { hanging_from = "chain_blue_center" }
